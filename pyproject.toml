[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credit-risk-engine"
version = "2.0.0"
description = "Production-grade credit risk system with model validation and monitoring capabilities"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zheyu Liu", email = "zheyuliu328@gmail.com"}
]
keywords = ["credit-risk", "model-validation", "pd-prediction", "risk-modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.1.0",
    "xgboost>=1.6.0",
    "shap>=0.41.0",
    "streamlit>=1.15.0",
    "plotly>=5.0.0",
    "matplotlib>=3.5.0",
    "yfinance>=0.1.87",
    "requests>=2.28.0",
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "ruff>=0.0.200",
    "mypy>=0.990",
    "pre-commit>=2.20.0",
]

[project.scripts]
credit-risk = "credit_risk_engine.cli:main"

[project.urls]
Homepage = "https://github.com/zheyuliu328/algorithmic-credit-risk-engine"
Documentation = "https://github.com/zheyuliu328/algorithmic-credit-risk-engine#readme"
Repository = "https://github.com/zheyuliu328/algorithmic-credit-risk-engine"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_one"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=credit_one --cov-report=term-missing"
