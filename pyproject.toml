[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "algorithmic-credit-risk-engine"
version = "1.0.0"
description = "Educational credit-scoring and model-metric prototypes"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "xgboost>=2.0",
    "shap>=0.42",
    "optbinning>=0.21",
    "statsmodels>=0.14",
    "jsonschema>=4",
    "PyYAML>=6",
]

[project.scripts]
credit-one = "credit_one.run:main"

[project.optional-dependencies]
fred = ["fredapi>=0.5"]
kaggle = ["kagglehub>=0.3"]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.15",
    "streamlit-aggrid>=0.3",
    "streamlit-extras>=0.4",
    "yfinance>=0.2",
]
test = ["pytest>=7.4"]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "black==25.11.0",
    "ruff==0.16.6",
    "build>=1.0",
    "hatchling>=1.27",
    "mypy",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/credit_one"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
